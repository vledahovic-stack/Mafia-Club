<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="cyber-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0820"/>
      <stop offset="80%" stop-color="#12030f"/>
      <stop offset="100%" stop-color="#080007"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="url(#cyber-bg)" stroke="#f43f5e" stroke-width="2.5" filter="url(#neon-glow)"/>

  <!-- Cyber Mask / Visor -->
  <g filter="url(#neon-glow)" stroke="#ff2d75" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Forehead & Helmet Crest -->
    <path d="M 32 30 L 50 20 L 68 30 L 68 44 L 50 36 L 32 44 Z" fill="rgba(255, 45, 117, 0.15)"/>
    <!-- Central Forehead Diamond -->
    <polygon points="50,23 55,30 50,35 45,30" fill="#ff2d75"/>
    
    <!-- Eyes / Glowing Visor -->
    <path d="M 34 48 L 47 48 L 49 54 L 37 54 Z" fill="#ff2d75"/>
    <path d="M 66 48 L 53 48 L 51 54 L 63 54 Z" fill="#ff2d75"/>

    <!-- Cheeks and Jaw -->
    <path d="M 32 44 L 28 58 L 36 74 L 50 82 L 64 74 L 72 58 L 68 44" fill="rgba(255, 45, 117, 0.08)"/>
    
    <!-- Chin Plate -->
    <path d="M 42 74 L 50 79 L 58 74 L 50 69 Z" fill="#ff2d75"/>

    <!-- Mouth / Vent Lines -->
    <line x1="43" y1="62" x2="57" y2="62" stroke="#ff2d75" stroke-width="2.2"/>
    <line x1="45" y1="66" x2="55" y2="66" stroke="#ff2d75" stroke-width="2"/>
  </g>
</svg>
