    <!-- Vite HMR WebSocket Guard for preview sandbox -->
    <script>
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var ProxyWebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var target = new EventTarget();
              var wsMock = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                url: String(url),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                }
              };
              setTimeout(function() {
                var openEv = new Event('open');
                if (typeof wsMock.onopen === 'function') wsMock.onopen(openEv);
                target.dispatchEvent(openEv);
              }, 10);
              return wsMock;
            }
            return new OrigWebSocket(url, protocols);
          };
          ProxyWebSocket.prototype = OrigWebSocket.prototype;
          ProxyWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          ProxyWebSocket.OPEN = OrigWebSocket.OPEN;
          ProxyWebSocket.CLOSING = OrigWebSocket.CLOSING;
          ProxyWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = ProxyWebSocket;
        }

        var origError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (
            (typeof first === 'string' && (first.indexOf('[vite]') !== -1 || first.indexOf('WebSocket closed without opened') !== -1)) ||
            (first && first.message && (first.message.indexOf('[vite]') !== -1 || first.message.indexOf('WebSocket closed without opened') !== -1))
          ) {
            return;
          }
          origError.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('[vite]') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
          if (event && event.error && event.error.message && (event.error.message.indexOf('WebSocket') !== -1 || event.error.message.indexOf('[vite]') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && event.reason.message && (event.reason.message.indexOf('WebSocket') !== -1 || event.reason.message.indexOf('[vite]') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
