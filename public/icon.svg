<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solid pure black background -->
    <!-- Metallic Chrome Text Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Red Neon Border Gradient -->
    <linearGradient id="redGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a2a" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Vibrant Red Tie & Hatband -->
    <linearGradient id="redTieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>

    <!-- Suit Lapel Highlights -->
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Solid Black Canvas Background (No crop, no extra margins) -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Main Composition Group -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Main Rounded Badge Frame -->
    <rect x="88" y="194" width="336" height="128" rx="16" fill="#070709" stroke="url(#redGlowGrad)" stroke-width="4.5"/>
    <!-- Fine Inner Stroke -->
    <rect x="92" y="198" width="328" height="120" rx="12" fill="none" stroke="#680a0a" stroke-width="1.2" opacity="0.8"/>

    <!-- Text "MA" -->
    <text x="102" y="294" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="106" fill="url(#chromeGrad)" letter-spacing="-1">MA</text>

    <!-- Text "FIA" -->
    <text x="282" y="294" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="106" fill="url(#chromeGrad)" letter-spacing="-1">FIA</text>

    <!-- Central Mobster Silhouette -->
    <g transform="translate(210, 172)">
      <!-- Fedora Hat Crown -->
      <path d="M 20 46 C 24 22, 68 22, 72 46 Z" fill="#14151a"/>
      <!-- Hat Crease Shadow -->
      <path d="M 34 25 C 46 30, 46 30, 58 25 C 52 22, 40 22, 34 25 Z" fill="#060608"/>
      
      <!-- Red Hatband -->
      <path d="M 20 42 C 32 45, 60 45, 72 42 L 73 47 C 60 50, 32 50, 19 47 Z" fill="url(#redTieGrad)"/>

      <!-- Fedora Brim -->
      <path d="M 0 52 Q 46 34 92 52 Q 46 40 0 52 Z" fill="url(#lapelGrad)"/>
      <path d="M 2 52 Q 46 36 90 52 Q 46 42 2 52 Z" fill="#0c0d12"/>

      <!-- Face Shadow Under Brim -->
      <path d="M 20 52 Q 46 56 72 52 L 66 78 Q 46 90 26 78 Z" fill="#050507"/>

      <!-- Shirt Collar -->
      <path d="M 32 76 L 46 94 L 60 76 L 53 74 L 46 82 L 39 74 Z" fill="#ffffff"/>

      <!-- Suit Lapels -->
      <!-- Left Lapel -->
      <path d="M 10 86 L 34 78 L 44 112 L 28 128 Z" fill="url(#lapelGrad)"/>
      <path d="M 12 88 L 32 81 L 41 110 L 27 124 Z" fill="#0d0e12"/>

      <!-- Right Lapel -->
      <path d="M 82 86 L 58 78 L 48 112 L 64 128 Z" fill="url(#lapelGrad)"/>
      <path d="M 80 88 L 60 81 L 51 110 L 65 124 Z" fill="#0d0e12"/>

      <!-- Red Tie -->
      <path d="M 42 84 L 50 84 L 53 116 L 46 130 L 39 116 Z" fill="url(#redTieGrad)"/>
      <!-- Tie Knot -->
      <path d="M 41 80 L 51 80 L 49 88 L 43 88 Z" fill="#991b1b"/>
    </g>

    <!-- Bottom Right "CLUB" Neon Badge -->
    <g transform="translate(266, 302)">
      <!-- Outer Red Rectangle Box -->
      <rect x="0" y="0" width="138" height="36" rx="8" fill="#070709" stroke="url(#redGlowGrad)" stroke-width="3"/>
      <!-- Inner Border -->
      <rect x="2" y="2" width="134" height="32" rx="6" fill="none" stroke="#680a0a" stroke-width="1" opacity="0.8"/>
      <!-- Text "CLUB" -->
      <text x="69" y="25" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#ff2a2a" text-anchor="middle" letter-spacing="3">CLUB</text>
    </g>
  </g>
</svg>