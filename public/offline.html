<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мафия Онлайн — Автономный режим</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0e15;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .badge {
      background: rgba(217, 119, 6, 0.2);
      border: 1px solid #d97706;
      color: #fbbf24;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 12px;
      color: #ffffff;
    }
    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.6;
      max-width: 440px;
      margin: 0 0 28px;
    }
    .btn {
      background: #d97706;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
      transition: background 0.2s;
    }
    .btn:hover {
      background: #b45309;
    }
  </style>
</head>
<body>
  <div class="badge">📡 Нет подключения к интернету</div>
  <h1>Город Засыпает...</h1>
  <p>Для игры в многопользовательскую Мафию и синхронизации с другими участниками требуется подключение к сети. Проверьте интернет и нажмите кнопку ниже.</p>
  <button class="btn" onclick="window.location.reload()">Повторить подключение</button>
</body>
</html>
